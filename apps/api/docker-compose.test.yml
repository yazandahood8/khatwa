# قاعدة بيانات وذاكرة مؤقتة للاختبارات التكاملية — throwaway Postgres + Redis for integration tests.
# منافذ غير قياسية (5433/6380) كي لا تتعارض مع أي خدمة محلية. بلا volume — تُمحى مع الحاوية.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khatwa_test
      POSTGRES_PASSWORD: khatwa_test
      POSTGRES_DB: khatwa_test
    ports:
      - '5544:5432'
    tmpfs:
      - /var/lib/postgresql/data # في الذاكرة — أسرع وبلا أثر على القرص
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U khatwa_test -d khatwa_test']
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - '6390:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
